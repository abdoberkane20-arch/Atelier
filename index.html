<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier Chiptuning – Gestion des commandes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--bg:#e9eef0;--card:rgba(255,255,255,.93);--ink:#14232b;--mute:#5d6f78;--line:#d0d9de;--acc:#0e6e6e;--acc-ink:#fff;--hd1:#0b4f55;--hd2:#14232b;
--s0:#5d6f78;--s1:#b26a00;--s2:#0e6e6e;--s3:#2f7d32;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1417;--card:rgba(24,36,42,.93);--ink:#e6eef1;--mute:#97a9b2;--line:#2b3b43;--acc:#3fb6b0;--acc-ink:#062423;--hd1:#0f3a3f;--hd2:#0a1114;--s0:#97a9b2;--s1:#f0a63a;--s2:#3fb6b0;--s3:#6fcf73;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#0d1417;--card:rgba(24,36,42,.93);--ink:#e6eef1;--mute:#97a9b2;--line:#2b3b43;--acc:#3fb6b0;--acc-ink:#062423;--hd1:#0f3a3f;--hd2:#0a1114;--s0:#97a9b2;--s1:#f0a63a;--s2:#3fb6b0;--s3:#6fcf73;--danger:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 16px/1.6 Cairo,system-ui,Arial,sans-serif}
.bgart{position:fixed;left:0;top:0;width:100%;height:100%;z-index:-1;color:var(--acc);opacity:.16;pointer-events:none}
main{max-width:720px;margin:0 auto;padding:0 14px 28px}
header{margin:0 -14px 14px;padding:18px 16px 16px;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;display:flex;align-items:center;gap:12px;border-radius:0 0 16px 16px}
header svg{flex:none}
header h1{font-size:1.3rem;margin:0;line-height:1.2}
header p{margin:2px 0 0;font-size:.85rem;opacity:.8}
h2{font-size:1.05rem;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.8rem;color:var(--mute)}
.stats b{display:block;font-size:1.25rem;color:var(--ink)}
nav{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:600 .95rem Cairo,Arial,sans-serif;color:var(--mute);cursor:pointer}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form .w{grid-column:1/-1}
label{font-size:.8rem;color:var(--mute);display:block}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:10px 14px;font:600 .95rem Cairo,Arial,sans-serif;cursor:pointer}
.btn.ghost{background:none;color:var(--danger);padding:4px 8px;font-size:.85rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;font:400 .85rem Cairo,Arial,sans-serif;cursor:pointer}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.car{font-weight:700}
.sub{color:var(--mute);font-size:.85rem}
.price{font-weight:700;white-space:nowrap}
.st{width:auto;font-weight:600;border-width:2px}
.empty{text-align:center;color:var(--mute);padding:24px 8px}
.pr{display:grid;grid-template-columns:1fr 110px auto;gap:6px;margin-bottom:6px}
a{color:var(--acc)}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:18px 0 4px;border-top:1px solid var(--line);margin-top:20px}
footer b{color:var(--ink)}
</style>
</head>
<body>
<svg class="bgart" viewBox="0 0 800 600" preserveAspectRatio="xMidYMax slice" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
<path d="M0 560H800"/>
<path d="M60 520V490Q60 475 80 472L190 460Q230 410 300 400H470Q540 405 590 460L700 472Q740 476 740 500V520Z"/>
<path d="M240 458Q270 418 310 412H400V458Z"/><path d="M416 412H470Q515 418 545 458H416Z"/>
<circle cx="220" cy="522" r="40"/><circle cx="220" cy="522" r="16"/><circle cx="580" cy="522" r="40"/><circle cx="580" cy="522" r="16"/>
<path d="M30 560V300M30 300H120M770 560V300M770 300H680"/>
<circle cx="640" cy="120" r="44" stroke-width="14" stroke-dasharray="11 11"/><circle cx="640" cy="120" r="34"/><circle cx="640" cy="120" r="12"/>
<path d="M90 90L190 190"/><circle cx="82" cy="82" r="20"/><path d="M200 200L215 215"/>
<rect x="330" y="80" width="100" height="100" rx="8"/><rect x="355" y="105" width="50" height="50" rx="4"/>
<path d="M345 80V60M370 80V60M395 80V60M420 80V60M345 180V200M370 180V200M395 180V200M420 180V200M330 100H310M330 125H310M330 150H310M430 100H450M430 125H450M430 150H450"/>
</svg>
<main>
<header>
<svg width="52" height="52" viewBox="0 0 52 52" role="img" aria-label="Logo">
<rect width="52" height="52" rx="12" fill="#3fb6b0"/>
<g stroke="#062423" stroke-width="2.4" stroke-linecap="round"><path d="M17 8v6M26 8v6M35 8v6M17 38v6M26 38v6M35 38v6M8 17h6M8 26h6M8 35h6M38 17h6M38 26h6M38 35h6"/></g>
<rect x="14" y="14" width="24" height="24" rx="4" fill="#062423"/>
<text x="26" y="31" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-weight="700" font-size="12" fill="#3fb6b0">AB</text>
</svg>
<div><h1>Atelier Chiptuning</h1><p>Abderrahmene Berkane</p></div>
</header>
<div class="stats" id="stats"></div>
<nav>
<button id="t-orders" onclick="go('orders')">Commandes</button>
<button id="t-clients" onclick="go('clients')">Clients</button>
<button id="t-prices" onclick="go('prices')">Tarifs</button>
</nav>

<section id="v-orders">
<div class="card">
<h2>Nouvelle commande</h2>
<form onsubmit="addOrder(event)">
<div><label for="n">Nom du client</label><input id="n" list="names" oninput="fillPhone()" required></div>
<div><label for="ph">Téléphone</label><input id="ph" type="tel" inputmode="tel"></div>
<div><label for="car">Véhicule</label><input id="car" placeholder="Golf 7 2.0 TDI" required></div>
<div><label for="pl">Immatriculation</label><input id="pl"></div>
<div><label for="ecu">ECU / Fichier</label><input id="ecu" placeholder="EDC17C64 – Bench"></div>
<div><label for="sv">Prestation</label><select id="sv" onchange="fillPrice()"></select></div>
<div><label for="pr">Prix (DA)</label><input id="pr" type="number" inputmode="numeric" min="0"></div>
<div><label for="nt">Remarques</label><input id="nt"></div>
<div class="w"><button class="btn" type="submit">Ajouter la commande</button></div>
</form>
<datalist id="names"></datalist>
</div>
<div class="chips" id="chips"></div>
<div id="list"></div>
</section>

<section id="v-clients" hidden><div id="clients"></div></section>

<section id="v-prices" hidden>
<div class="card">
<h2>Liste des tarifs</h2>
<div id="plist"></div>
<form onsubmit="addPrice(event)" style="grid-template-columns:1fr 110px auto;margin-top:10px">
<input id="np" placeholder="Nouvelle prestation" required>
<input id="npp" type="number" inputmode="numeric" min="0" placeholder="Prix" required>
<button class="btn" type="submit">Ajouter</button>
</form>
</div>
</section>

<footer>Créé par <b>Abderrahmene Berkane</b></footer>
</main>

<script>
const K='chip_ws_v2';
const DEF=[['Eco',15000],['Stage 1',30000],['Stage 2',50000],['Stage 3',80000],['Mesure Dyno',5000],['Diagnostic OBD',3000],
['Lecture / Écriture ECU',10000],['Clonage ECU',25000],['Vidage + synchronisation',20000],['Immo Off',15000],
['DPF / FAP Off',20000],['EGR Off',15000],['AdBlue / SCR Off',25000],['Sonde O2 Off',8000],['Catalyseur Off',15000],
['Swirl Flaps Off',10000],['Start & Stop Off',5000],['Speed Limiter Off',5000],['DTC Off (codes défauts)',5000],
['Pop & Bang',10000],['Launch Control',10000],['Retour origine (Stock)',5000]].map(([n,p])=>({n,p}));
let S={orders:[],prices:DEF.map(x=>({...x})),v:3};
try{const r=localStorage.getItem(K);if(r){const j=JSON.parse(r);if(j&&j.orders&&j.prices)S=j}}catch(e){}
if(S.v!==3){DEF.forEach(d=>{if(!S.prices.some(p=>p.n===d.n))S.prices.push({...d})});S.v=3;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('fr-FR');
const ST=['Nouveau','En cours','Prêt','Livré'];
let tab='orders',flt=-1;

function go(t){tab=t;render()}
function setFlt(f){flt=f;render()}

function addOrder(e){
  e.preventDefault();
  S.orders.unshift({id:Date.now(),n:$('#n').value.trim(),ph:$('#ph').value.trim(),car:$('#car').value.trim(),
    pl:$('#pl').value.trim(),ecu:$('#ecu').value.trim(),sv:$('#sv').value,p:+$('#pr').value||0,
    nt:$('#nt').value.trim(),s:0,d:new Date().toLocaleDateString('fr-FR')});
  save();e.target.reset();fillPrice();render();
}
function fillPrice(){const p=S.prices.find(x=>x.n===$('#sv').value);$('#pr').value=p?p.p:''}
function fillPhone(){const o=S.orders.find(x=>x.n===$('#n').value);if(o&&!$('#ph').value)$('#ph').value=o.ph}
function setSt(id,v){const o=S.orders.find(x=>x.id===id);if(o){o.s=+v;save();render()}}
function delOrder(id){if(confirm('Supprimer cette commande ?')){S.orders=S.orders.filter(x=>x.id!==id);save();render()}}
function addPrice(e){e.preventDefault();S.prices.push({n:$('#np').value.trim(),p:+$('#npp').value||0});save();e.target.reset();render()}
function setPrice(i,k,v){S.prices[i][k]=k==='p'?(+v||0):v;save();renderSelect()}
function delPrice(i){if(confirm('Supprimer cette prestation ?')){S.prices.splice(i,1);save();render()}}

function renderSelect(){
  const cur=$('#sv').value;
  $('#sv').innerHTML=S.prices.map(p=>`<option>${esc(p.n)}</option>`).join('');
  if(S.prices.some(p=>p.n===cur))$('#sv').value=cur;
  if(!$('#pr').value)fillPrice();
}

function render(){
  const done=S.orders.filter(o=>o.s===3),open=S.orders.filter(o=>o.s<3);
  $('#stats').innerHTML=`<div><b>${open.length}</b>Commandes ouvertes</div><div><b>${done.length}</b>Commandes livrées</div><div><b>${fmt(done.reduce((a,o)=>a+o.p,0))}</b>Revenu (DA)</div>`;
  for(const t of ['orders','clients','prices']){
    $('#t-'+t).className=t===tab?'on':'';$('#v-'+t).hidden=t!==tab;
  }
  renderSelect();
  $('#names').innerHTML=[...new Set(S.orders.map(o=>o.n))].map(n=>`<option value="${esc(n)}">`).join('');

  $('#chips').innerHTML=[['Toutes',-1],...ST.map((s,i)=>[s,i])].map(([l,v])=>`<button class="${flt===v?'on':''}" onclick="setFlt(${v})">${l}</button>`).join('');
  const L=S.orders.filter(o=>flt<0||o.s===flt);
  $('#list').innerHTML=L.length?L.map(o=>`<div class="card">
    <div class="row"><div><div class="car">${esc(o.car)}${o.pl?' – '+esc(o.pl):''}</div>
    <div class="sub">${esc(o.n)}${o.ph?' – <a href="tel:'+esc(o.ph)+'">'+esc(o.ph)+'</a>':''}</div></div>
    <div class="price">${fmt(o.p)} DA</div></div>
    <div class="sub">${esc(o.sv)}${o.ecu?' – '+esc(o.ecu):''}</div>
    ${o.nt?'<div class="sub">'+esc(o.nt)+'</div>':''}
    <div class="row" style="align-items:center;margin-top:8px">
    <select class="st" style="color:var(--s${o.s});border-color:var(--s${o.s})" onchange="setSt(${o.id},this.value)" aria-label="Statut">${ST.map((s,i)=>`<option value="${i}"${i===o.s?' selected':''}>${s}</option>`).join('')}</select>
    <span class="sub">${o.d}</span>
    <button class="btn ghost" onclick="delOrder(${o.id})">Supprimer</button></div></div>`).join('')
    :'<div class="empty">Aucune commande ici. Ajoutez la première avec le formulaire ci-dessus.</div>';

  const C={};
  S.orders.forEach(o=>{const k=o.n+'|'+o.ph;(C[k]=C[k]||{n:o.n,ph:o.ph,c:0,t:0,car:o.car}).c++;C[k].t+=o.s===3?o.p:0});
  const CL=Object.values(C);
  $('#clients').innerHTML=CL.length?CL.map(c=>`<div class="card"><div class="row"><div><div class="car">${esc(c.n)}</div>
    <div class="sub">${c.ph?'<a href="tel:'+esc(c.ph)+'">'+esc(c.ph)+'</a> – ':''}Dernier véhicule : ${esc(c.car)}</div></div>
    <div style="text-align:right"><div class="price">${fmt(c.t)} DA</div><div class="sub">${c.c} commande${c.c>1?'s':''}</div></div></div></div>`).join('')
    :'<div class="empty">Les clients apparaissent ici automatiquement après l’ajout de commandes.</div>';

  $('#plist').innerHTML=S.prices.map((p,i)=>`<div class="pr">
    <input value="${esc(p.n)}" onchange="setPrice(${i},'n',this.value)" aria-label="Nom de la prestation">
    <input type="number" inputmode="numeric" value="${p.p}" onchange="setPrice(${i},'p',this.value)" aria-label="Prix">
    <button class="btn ghost" onclick="delPrice(${i})">Supprimer</button></div>`).join('');
}
render();
</script>
</body>
</html>
